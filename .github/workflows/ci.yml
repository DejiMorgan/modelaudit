name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify Alembic on a fresh database
        env:
          MODELAUDIT_DATABASE_URL: sqlite:///./ci-migrations.sqlite3
        run: alembic upgrade head
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    name: Frontend / Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A lockfile is not bundled because registry access was unavailable
      # when preparing this release. npm install resolves dependencies in CI.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
